<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Yincana PC</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Gestión y ranking en directo de la yincana de montaje de ordenadores."
    />
    <meta name="theme-color" content="#f3f5f9" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- iOS: instalable con "Compartir → Añadir a pantalla de inicio". -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Yincana PC" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica el tema antes de pintar para evitar parpadeos.
      try {
        var t = localStorage.getItem('yincana.theme');
        if (t !== 'light' && t !== 'dark')
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>Yincana PC necesita JavaScript para funcionar.</noscript>
  </body>
</html>
