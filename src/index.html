<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Yincana PC</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Gestión y ranking en directo de la yincana de montaje de ordenadores."
    />
    <meta name="theme-color" content="#f3f5f9" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- iOS: instalable con "Compartir → Añadir a pantalla de inicio". -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Yincana PC" />
    <!-- Sin apple-mobile-web-app-status-bar-style a propósito: con "black-translucent" la app
         se pinta por debajo de la hora y iOS 26.1+ dibuja encima un degradado/blur que no se
         puede tapar. Sin la meta, la barra de estado ocupa su propio hueco con el color de la
         página (recomendación de Apple en el bug 317153 de WebKit). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica el tema antes de pintar para evitar parpadeos.
      try {
        var t = localStorage.getItem('yincana.theme');
        if (t !== 'light' && t !== 'dark')
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <!-- Pantalla de carga: se pinta antes de que arranque Angular y la quita splash.ts. -->
    <style>
      #splash {
        --sp-bg: #f3f5f9;
        --sp-text: #0f1726;
        --sp-muted: #5a6577;
        --sp-primary: #1f6feb;
        --sp-accent: #0f9d6e;
        --sp-track: rgba(15, 23, 38, 0.08);
        --sp-dot: rgba(15, 23, 38, 0.07);
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(520px 420px at 50% 38%, color-mix(in srgb, var(--sp-primary) 20%, transparent), transparent 70%),
          radial-gradient(420px 320px at 50% 75%, color-mix(in srgb, var(--sp-accent) 12%, transparent), transparent 70%),
          var(--sp-bg);
        color: var(--sp-text);
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        transition:
          opacity 0.5s ease,
          visibility 0.5s;
      }
      html[data-theme='dark'] #splash {
        --sp-bg: #0b1119;
        --sp-text: #e6ecf4;
        --sp-muted: #98a5b8;
        --sp-primary: #4d8dff;
        --sp-accent: #2fcf8f;
        --sp-track: rgba(230, 236, 244, 0.08);
        --sp-dot: rgba(230, 236, 244, 0.06);
      }
      /* Textura de placa base. */
      #splash::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image: radial-gradient(var(--sp-dot) 1.2px, transparent 1.2px);
        background-size: 18px 18px;
        mask-image: radial-gradient(circle at 50% 42%, #000 0%, transparent 65%);
        -webkit-mask-image: radial-gradient(circle at 50% 42%, #000 0%, transparent 65%);
        animation: sp-grid 1.2s ease-out both;
      }
      #splash.is-out {
        opacity: 0;
        visibility: hidden;
      }
      #splash.is-out .sp-inner {
        transform: scale(1.08);
        filter: blur(6px);
      }
      .sp-inner {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
        transition:
          transform 0.5s cubic-bezier(0.4, 0, 0.2, 1),
          filter 0.5s;
      }

      /* ---- Logo ---- */
      .sp-logo {
        position: relative;
        width: 128px;
        height: 128px;
        animation: sp-pop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      .sp-glow {
        position: absolute;
        inset: -30px;
        border-radius: 50%;
        background: radial-gradient(circle, color-mix(in srgb, var(--sp-primary) 45%, transparent), transparent 65%);
        filter: blur(14px);
        animation: sp-breathe 2.4s ease-in-out infinite;
      }
      .sp-ring {
        position: absolute;
        inset: -22px;
        border-radius: 50%;
        padding: 3px;
        background: conic-gradient(from 0deg, transparent 0 55%, var(--sp-primary) 75%, var(--sp-accent) 92%, transparent);
        -webkit-mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask:
          linear-gradient(#000 0 0) content-box exclude,
          linear-gradient(#000 0 0);
        animation: sp-spin 1.6s linear infinite;
      }
      .sp-logo svg {
        position: relative;
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 14px 30px color-mix(in srgb, var(--sp-primary) 40%, transparent));
      }
      .sp-draw {
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: sp-draw 0.6s cubic-bezier(0.65, 0, 0.35, 1) forwards;
      }
      .sp-body {
        animation-delay: 0.25s;
        animation-duration: 0.8s;
      }
      .sp-pin:nth-child(1) { animation-delay: 0.55s; }
      .sp-pin:nth-child(2) { animation-delay: 0.6s; }
      .sp-pin:nth-child(3) { animation-delay: 0.65s; }
      .sp-pin:nth-child(4) { animation-delay: 0.7s; }
      .sp-pin:nth-child(5) { animation-delay: 0.75s; }
      .sp-pin:nth-child(6) { animation-delay: 0.8s; }
      .sp-pin:nth-child(7) { animation-delay: 0.85s; }
      .sp-pin:nth-child(8) { animation-delay: 0.9s; }
      /* Pulsos de señal que entran por los pines hacia el núcleo. */
      .sp-signal path {
        stroke-dasharray: 0.35 1.65;
        stroke-dashoffset: 0.35;
        opacity: 0;
        animation: sp-signal 1.4s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      }
      .sp-signal path:nth-child(odd) { animation-delay: 1.2s; }
      .sp-signal path:nth-child(even) { animation-delay: 1.9s; }
      .sp-core {
        transform-origin: 256px 256px;
        transform: scale(0);
        animation:
          sp-core-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.95s forwards,
          sp-core-beat 1.4s ease-in-out 1.6s infinite;
      }

      /* ---- Texto ---- */
      .sp-word {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      .sp-title {
        margin: 0;
        font-size: 1.75rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        animation: sp-up 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.35s both;
      }
      .sp-title b {
        background: linear-gradient(90deg, var(--sp-primary), var(--sp-accent));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .sp-msg {
        min-height: 1.3em;
        font-size: 0.82rem;
        font-weight: 500;
        color: var(--sp-muted);
        font-family: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
        animation: sp-up 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.5s both;
        transition: opacity 0.2s;
      }
      .sp-msg.is-swap {
        opacity: 0;
      }
      .sp-bar {
        position: relative;
        width: 168px;
        height: 4px;
        border-radius: 99px;
        overflow: hidden;
        background: var(--sp-track);
        animation: sp-up 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.6s both;
      }
      .sp-bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 45%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--sp-primary), var(--sp-accent));
        box-shadow: 0 0 12px var(--sp-accent);
        animation: sp-load 1.3s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      @keyframes sp-pop {
        from { opacity: 0; transform: scale(0.6) rotate(-8deg); }
        to { opacity: 1; transform: none; }
      }
      @keyframes sp-grid {
        from { opacity: 0; transform: scale(1.15); }
      }
      @keyframes sp-breathe {
        50% { opacity: 0.55; transform: scale(0.9); }
      }
      @keyframes sp-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes sp-draw {
        to { stroke-dashoffset: 0; }
      }
      @keyframes sp-signal {
        0% { stroke-dashoffset: 0.35; opacity: 1; }
        70% { opacity: 1; }
        100% { stroke-dashoffset: -1; opacity: 0; }
      }
      @keyframes sp-core-in {
        to { transform: scale(1); }
      }
      @keyframes sp-core-beat {
        0%, 100% { transform: scale(1); }
        40% { transform: scale(1.14); filter: brightness(1.25); }
      }
      @keyframes sp-up {
        from { opacity: 0; transform: translateY(10px); }
      }
      @keyframes sp-load {
        from { transform: translateX(-110%); }
        to { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash *,
        #splash::before {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
        .sp-signal { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Cargando Yincana PC">
      <div class="sp-inner">
        <div class="sp-logo">
          <div class="sp-glow"></div>
          <div class="sp-ring"></div>
          <svg viewBox="0 0 512 512" aria-hidden="true">
            <defs>
              <linearGradient id="sp-g" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#1f6feb" />
                <stop offset="1" stop-color="#13a174" />
              </linearGradient>
            </defs>
            <rect width="512" height="512" rx="112" fill="url(#sp-g)" />
            <g fill="none" stroke="#fff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
              <rect class="sp-draw sp-body" x="151" y="151" width="210" height="210" rx="30" pathLength="1" />
              <g>
                <path class="sp-draw sp-pin" d="M204 92v59" pathLength="1" />
                <path class="sp-draw sp-pin" d="M420 204h-59" pathLength="1" />
                <path class="sp-draw sp-pin" d="M308 420v-59" pathLength="1" />
                <path class="sp-draw sp-pin" d="M92 308h59" pathLength="1" />
                <path class="sp-draw sp-pin" d="M308 92v59" pathLength="1" />
                <path class="sp-draw sp-pin" d="M420 308h-59" pathLength="1" />
                <path class="sp-draw sp-pin" d="M204 420v-59" pathLength="1" />
                <path class="sp-draw sp-pin" d="M92 204h59" pathLength="1" />
              </g>
            </g>
            <g class="sp-signal" fill="none" stroke="#7dffc9" stroke-width="14" stroke-linecap="round">
              <path d="M204 92v59" pathLength="1" />
              <path d="M420 204h-59" pathLength="1" />
              <path d="M308 420v-59" pathLength="1" />
              <path d="M92 308h59" pathLength="1" />
              <path d="M308 92v59" pathLength="1" />
              <path d="M420 308h-59" pathLength="1" />
              <path d="M204 420v-59" pathLength="1" />
              <path d="M92 204h59" pathLength="1" />
            </g>
            <rect class="sp-core" x="216" y="216" width="80" height="80" rx="14" fill="#2fcf8f" stroke="#fff" stroke-width="12" />
          </svg>
        </div>
        <div class="sp-word">
          <h1 class="sp-title">Yincana <b>PC</b></h1>
          <div class="sp-msg" id="sp-msg">Encendiendo la placa…</div>
        </div>
        <div class="sp-bar"></div>
      </div>
    </div>
    <script>
      // Mensajes de "arranque" mientras carga; se detiene sola al quitar la pantalla.
      (function () {
        var msgs = ['Encendiendo la placa…', 'Comprobando la RAM…', 'Cargando la BIOS…', 'Conectando con el ranking…'];
        var el = document.getElementById('sp-msg');
        var i = 0;
        var timer = setInterval(function () {
          if (!el || !el.isConnected) return clearInterval(timer);
          el.classList.add('is-swap');
          setTimeout(function () {
            i = (i + 1) % msgs.length;
            el.textContent = msgs[i];
            el.classList.remove('is-swap');
          }, 200);
        }, 1100);
      })();
    </script>
    <app-root></app-root>
    <noscript>Yincana PC necesita JavaScript para funcionar.</noscript>
  </body>
</html>
